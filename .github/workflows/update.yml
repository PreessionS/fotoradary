
name: Update speed cameras

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      countries: ${{ steps.c.outputs.countries }}
    steps:
      - id: c
        run: |
          echo 'countries=["austria","belgium","bulgaria","croatia","cyprus","czech-republic","denmark","estonia","finland","france","germany","greece","hungary","ireland-and-northern-ireland","italy","latvia","lithuania","luxembourg","malta","netherlands","poland","portugal","romania","slovakia","slovenia","spain","sweden","united-kingdom/england"]' >> "$GITHUB_OUTPUT"

  extract:
    needs: setup
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        country: ${{ fromJSON(needs.setup.outputs.countries) }}
    uses: ./.github/workflows/extract-country.yml
    with:
      country: ${{ matrix.country }}

  find-missing:
    needs: [setup, extract]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.m.outputs.missing }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTRIES: ${{ needs.setup.outputs.countries }}
        run: |
          have=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].name' | jq -R . | jq -sc .)

          missing=$(jq -c --argjson have "$have" \
            '[.[] | select(("pts-" + (split("/") | last)) as $n | ($have | any(. == $n)) | not)]' \
            <<< "$COUNTRIES")

          echo "Brakuje: $missing"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

  retry-1:
    needs: [setup, find-missing]
    if: ${{ !cancelled() && needs.find-missing.outputs.missing != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        country: ${{ fromJSON(needs.find-missing.outputs.missing) }}
    uses: ./.github/workflows/extract-country.yml
    with:
      country: ${{ matrix.country }}

  check-1:
    needs: [setup, retry-1]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.m.outputs.missing }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTRIES: ${{ needs.setup.outputs.countries }}
        run: |
          sleep 60

          have=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].name' | jq -R . | jq -sc .)

          missing=$(jq -c --argjson have "$have" \
            '[.[] | select(("pts-" + (split("/") | last)) as $n | ($have | any(. == $n)) | not)]' \
            <<< "$COUNTRIES")

          echo "Pozostałe braki: $missing"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

  retry-2:
    needs: [setup, check-1]
    if: ${{ !cancelled() && needs.check-1.outputs.missing != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        country: ${{ fromJSON(needs.check-1.outputs.missing) }}
    uses: ./.github/workflows/extract-country.yml
    with:
      country: ${{ matrix.country }}

  check-2:
    needs: [setup, retry-2]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.m.outputs.missing }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTRIES: ${{ needs.setup.outputs.countries }}
        run: |
          sleep 120

          have=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].name' | jq -R . | jq -sc .)

          missing=$(jq -c --argjson have "$have" \
            '[.[] | select(("pts-" + (split("/") | last)) as $n | ($have | any(. == $n)) | not)]' \
            <<< "$COUNTRIES")

          echo "Pozostałe braki: $missing"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

  retry-3:
    needs: [setup, check-2]
    if: ${{ !cancelled() && needs.check-2.outputs.missing != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        country: ${{ fromJSON(needs.check-2.outputs.missing) }}
    uses: ./.github/workflows/extract-country.yml
    with:
      country: ${{ matrix.country }}

  check-3:
    needs: [setup, retry-3]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.m.outputs.missing }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTRIES: ${{ needs.setup.outputs.countries }}
        run: |
          sleep 240

          have=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].name' | jq -R . | jq -sc .)

          missing=$(jq -c --argjson have "$have" \
            '[.[] | select(("pts-" + (split("/") | last)) as $n | ($have | any(. == $n)) | not)]' \
            <<< "$COUNTRIES")

          echo "Pozostałe braki: $missing"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

  retry-4:
    needs: [setup, check-3]
    if: ${{ !cancelled() && needs.check-3.outputs.missing != '[]' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        country: ${{ fromJSON(needs.check-3.outputs.missing) }}
    uses: ./.github/workflows/extract-country.yml
    with:
      country: ${{ matrix.country }}

  final-check:
    needs: [setup, retry-4]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    outputs:
      missing: ${{ steps.m.outputs.missing }}
    steps:
      - id: m
        env:
          GH_TOKEN: ${{ github.token }}
          COUNTRIES: ${{ needs.setup.outputs.countries }}
        run: |
          sleep 30

          have=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[].name' | jq -R . | jq -sc .)

          missing=$(jq -c --argjson have "$have" \
            '[.[] | select(("pts-" + (split("/") | last)) as $n | ($have | any(. == $n)) | not)]' \
            <<< "$COUNTRIES")

          echo "Końcowa kontrola: $missing"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

  publish:
    needs: [setup, final-check]
    if: >-
      ${{
        !cancelled() &&
        needs.final-check.result == 'success' &&
        needs.final-check.outputs.missing == '[]'
      }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          pattern: pts-*
          merge-multiple: true
          path: data

      - name: Build tiles
        run: python3 scripts/merge.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
